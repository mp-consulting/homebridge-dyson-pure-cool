name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token is only needed here, for npm provenance (OIDC)
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No npm cache in the job holding id-token: write (cache poisoning risk)

      # Use the npm bundled with Node 24. A global `npm install -g npm@latest`
      # self-upgrade can land a build whose bundled `sigstore` dependency is
      # not unpacked, breaking `npm publish --provenance` with
      # "Cannot find module 'sigstore'". The CI (build.yml) already runs
      # `npm ci` on the bundled npm across Node 22/24/26, so it is sufficient
      # here too.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
