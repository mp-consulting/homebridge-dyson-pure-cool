name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token is only needed here, for npm provenance (OIDC)
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No npm cache in the job holding id-token: write (cache poisoning risk)

      # Use the npm bundled with Node 24. A global `npm install -g npm@latest`
      # self-upgrade can land a build whose bundled `sigstore` dependency is
      # not unpacked, breaking `npm publish --provenance` with
      # "Cannot find module 'sigstore'". The CI (build.yml) already runs
      # `npm ci` on the bundled npm across Node 22/24/26, so it is sufficient
      # here too.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Skip publishing when this exact version is already on npm (e.g. a re-run
      # or a stray release), so the job doesn't fail with a 409.
      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance --access public
